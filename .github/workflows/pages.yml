# Publishes only the static browser app (index.html, styles.css, app.js, src/) to GitHub Pages.
# docs/, evals/, tests/, history/ and the CLI are not published. The app makes no network
# requests; Pages cannot send response headers, so the <meta> CSP in index.html applies.
name: pages

# Deploys only after the full ci workflow succeeds for a push to main (or on manual dispatch),
# and only if that commit is still the tip of main, so a late CI run cannot roll the site back.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: fresh
        name: Skip unless this commit is the tip of main
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $DEPLOY_SHA: main is now at $tip, which deploys after its own ci run."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.fresh.outputs.current == 'true'
        name: Checks before publishing
        run: |
          node evals/run-static-privacy-checks.js
          node tests/test-sanitizer.js
          node tests/test-review-ui.js
          node tests/test-worker.js
      - if: steps.fresh.outputs.current == 'true'
        name: Assemble site (app files only)
        run: |
          mkdir -p _site/src
          cp index.html styles.css app.js _site/
          cp src/sanitizer.js src/worker.js _site/src/
          touch _site/.nojekyll
          find _site -type f | sort
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: recheck
        name: Re-check the tip of main just before deploying
        if: steps.fresh.outputs.current == 'true'
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $DEPLOY_SHA: main is now at $tip, which deploys after its own ci run."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.recheck.outputs.current == 'true'
        uses: actions/deploy-pages@v4
